    - admissionReviewVersions:
      - v1
      clientConfig:
        service:
          name: prometheus-kube-prometheus-operator
          namespace: default
          path: /admission-prometheusrules/validate
      failurePolicy: Ignore
      name: prometheusrulevalidate.monitoring.coreos.com
      rules:
      - apiGroups:
        - monitoring.coreos.com
        apiVersions:
        - '*'
        operations:
        - CREATE
        - UPDATE
        resources:
        - prometheusrules
      sideEffects: None
