# Rendered objects by Helm release, as live_drift.render_objects collects them.
# clusterScoped lists the apiVersion:Kind values that discovery reports without a namespace.
clusterScoped:
- admissionregistration.k8s.io/v1:ValidatingWebhookConfiguration
- apiextensions.k8s.io/v1:CustomResourceDefinition
releases:
  default/demo-resources:
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      annotations:
        cert-manager.io/issuer: letsencrypt
        helm.sh/resource-policy: keep
      name: jaeger-demo-ingress
      namespace: default
    spec:
      ingressClassName: nginx
      rules:
      - host: demo.example.test
        http:
          paths:
          - backend:
              service:
                name: jaeger-query
                port:
                  number: 16686
            path: /
            pathType: Prefix
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      annotations:
        helm.sh/resource-policy: keep
      labels:
        app: trace-generator
      name: trace-generator
      namespace: default
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: trace-generator
      template:
        metadata:
          labels:
            app: trace-generator
        spec:
          containers:
          - image: python:3.12-slim
            imagePullPolicy: IfNotPresent
            name: trace-generator
            ports:
            - containerPort: 16686
              name: query
            readinessProbe:
              httpGet:
                path: /
                port: 14269
            resources:
              limits:
                cpu: 1000m
                memory: 512Mi
  default/jaeger:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
      name: jaeger
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: jaeger
      template:
        metadata:
          labels:
            app.kubernetes.io/name: jaeger
        spec:
          containers:
          - image: docker.io/jaegertracing/jaeger-snapshot:0012345
            imagePullPolicy: Always
            name: jaeger
            ports:
            - containerPort: 16686
              name: query
            readinessProbe:
              httpGet:
                path: /
                port: 14269
            resources:
              limits:
                cpu: 1000m
                memory: 512Mi
          serviceAccountName: jaeger
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app.kubernetes.io/managed-by: Helm
      name: jaeger-collector
    spec:
      clusterIP: None
      ports:
      - name: grpc
        port: 4317
        targetPort: 0
      selector:
        app.kubernetes.io/name: jaeger
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app.kubernetes.io/managed-by: Helm
      name: jaeger-query
    spec:
      clusterIP: None
      ports:
      - name: query
        port: 16686
      selector:
        app.kubernetes.io/name: jaeger
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app.kubernetes.io/managed-by: Helm
      name: jaeger-hotrod
    spec:
      ports:
      - name: frontend
        port: 80
        targetPort: 8080
      selector:
        app.kubernetes.io/name: jaeger
  default/prometheus:
  - apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      annotations:
        operator.prometheus.io/version: 0.95.2
      name: servicemonitors.monitoring.coreos.com
    spec:
      group: monitoring.coreos.com
      names:
        kind: ServiceMonitor
        listKind: ServiceMonitorList
        plural: servicemonitors
        singular: servicemonitor
      scope: Namespaced
      versions:
      - name: v1
        schema:
          openAPIV3Schema:
            properties:
              spec:
                properties:
                  endpoints:
                    items:
                      properties:
                        port:
                          type: string
                        relabelings:
                          items:
                            properties:
                              action:
                                default: replace
                                type: string
                              targetLabel:
                                type: string
                            type: object
                          type: array
                      type: object
                    type: array
                type: object
            type: object
        served: true
        storage: true
