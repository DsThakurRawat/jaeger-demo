# Where the Helmfile engine takes the Jaeger and HotROD images from
# (docs/releases.md#helmfile-engine).
#
# live:   reuse each live image reference exactly, as a tag. Ownership adoption
#         must not change the pod templates, so it ran in this mode. A scheduled run
#         refuses it.
# digest: resolve the upstream snapshots, pin them as tag@sha256 and validate them
#         against both Jaeger renders before any credential-holding step. The
#         first apply in this mode changes the Jaeger and HotROD pod templates of
#         both stacks to digest references, so those Deployments roll once.
mode: digest
