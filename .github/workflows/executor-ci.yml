name: In-cluster executor rehearsal
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        persist-credentials: false
    - name: Build the unpublished Linux AMD64 image
      run: |
        echo "KUBECONFIG=$RUNNER_TEMP/executor-kind.yaml" >> "$GITHUB_ENV"
        docker buildx create --driver docker-container --name executor-builder --use
        docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
          -f ops/executor/Containerfile -t ghcr.io/jaegertracing/jaeger-demo-executor:fixture \
          --output "type=oci,dest=$RUNNER_TEMP/executor.tar" .
    - name: Start disposable Kubernetes
      working-directory: ${{ runner.temp }}
      run: |
        curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64
        echo '50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  kind' | sha256sum --check
        chmod u+x kind
        ./kind create cluster --name jaeger-executor-ci --kubeconfig "$KUBECONFIG" \
          --image kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    - name: Load and verify the candidate digest inside the test node
      run: |
        set -euo pipefail
        digest=$(tar -xOf "$RUNNER_TEMP/executor.tar" index.json | jq -er '.manifests | select(length == 1) | .[0].digest')
        image="ghcr.io/jaegertracing/jaeger-demo-executor@$digest"
        node=jaeger-executor-ci-control-plane
        docker exec -i "$node" ctr -n k8s.io images import --digests - < "$RUNNER_TEMP/executor.tar"
        if ! docker exec "$node" crictl inspecti "$image" >/dev/null 2>&1; then
          docker exec "$node" ctr -n k8s.io images tag ghcr.io/jaegertracing/jaeger-demo-executor:fixture "$image"
        fi
        docker exec "$node" crictl inspecti "$image" >/dev/null
        echo "EXERCISE_IMAGE=$image" >> "$GITHUB_ENV"
    - name: Verify the installed receiver in disposable pods
      run: bash scripts/demo/rehearsals/executor-runtime/run.sh
