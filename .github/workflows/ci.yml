name: Demo CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Demo tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        persist-credentials: false
    - name: Install shell dependencies
      run: sudo apt-get update && sudo apt-get install -y shellcheck jq
    - name: Install shunit2
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        repository: kward/shunit2
        ref: 080159b303537888c5d41910b4d47a5002638e30 # v2.1.8
        path: .tools/shunit2
        persist-credentials: false
    - name: Install Helm for credential-free chart tests
      uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
      with:
        version: v4.3.2
    - name: Verify the pinned Helmfile toolchain
      run: make helmfile-tools
    - name: Install and verify constrained OCI CLI without credentials
      env:
        PIP_CONSTRAINT: ${{ github.workspace }}/scripts/demo/oci-cli-constraints.txt
      run: |
        python -m pip install oci-cli
        python scripts/demo/verify_oci_cli.py
    - name: Lint shell scripts
      run: shellcheck scripts/demo/*.sh scripts/utils/*.sh examples/oci/*.sh examples/otel-demo/*.sh
    - name: Lint workflows
      run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
    - name: Lint Python
      run: |
        python -m pip install -r scripts/utils/lint-requirements.txt
        ruff check .
    - name: Test scripts and chart rendering
      env:
        SHUNIT2: .tools/shunit2
      run: make test

  adoption:
    name: Helmfile render and adoption rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        persist-credentials: false
    - name: Install the constrained YAML parser
      run: python3 -m pip install -c scripts/demo/oci-cli-constraints.txt PyYAML
    - name: Compare and validate application and companion manifests
      run: python3 scripts/demo/helmfile_tools.py run -- bash scripts/demo/validate-helmfile.sh
    - name: Create the disposable Kubernetes fixture
      working-directory: ${{ runner.temp }}
      run: |
        curl --fail --location --silent --show-error --output kind https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64
        echo '50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  kind' | sha256sum --check
        chmod u+x kind
        ./kind create cluster --name jaeger-demo-adoption-fixture --kubeconfig "$RUNNER_TEMP/fixture.yaml" \
          --image kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    - name: Check ownership transfer, no-op apply and retention
      run: |
        python3 scripts/demo/helmfile_tools.py run -- python3 scripts/demo/rehearsals/companion-adoption/exercise.py \
          --kubeconfig "$RUNNER_TEMP/fixture.yaml" --context kind-jaeger-demo-adoption-fixture
    - name: Verify failed-release retry, pending states and the OCI gate
      run: |
        python3 scripts/demo/helmfile_tools.py run -- python3 scripts/demo/rehearsals/release-phases/exercise.py \
          --kubeconfig "$RUNNER_TEMP/fixture.yaml" --context kind-jaeger-demo-adoption-fixture

  renovate:
    name: Renovate discovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        persist-credentials: false
    - name: Verify Renovate configuration and dependency discovery without credentials
      run: make renovate-discovery
