name: Demo CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Demo tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        persist-credentials: false
    - name: Install shell dependencies
      run: sudo apt-get update && sudo apt-get install -y shellcheck jq
    - name: Install shunit2
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        repository: kward/shunit2
        ref: 080159b303537888c5d41910b4d47a5002638e30 # v2.1.8
        path: .tools/shunit2
        persist-credentials: false
    - name: Install Helm for credential-free chart tests
      uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
      with:
        version: v4.3.2
    - name: Install and verify constrained OCI CLI without credentials
      env:
        PIP_CONSTRAINT: ${{ github.workspace }}/scripts/demo/oci-cli-constraints.txt
      run: |
        python -m pip install oci-cli
        python scripts/demo/verify_oci_cli.py
    - name: Lint shell scripts
      run: shellcheck scripts/demo/*.sh scripts/utils/*.sh
    - name: Lint workflows
      run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
    - name: Lint Python
      run: |
        python -m pip install -r scripts/utils/lint-requirements.txt
        ruff check .
    - name: Test scripts and chart rendering
      env:
        SHUNIT2: .tools/shunit2
      run: make test

  renovate:
    name: Renovate discovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        persist-credentials: false
    - name: Verify Renovate configuration and dependency discovery without credentials
      run: make renovate-discovery
