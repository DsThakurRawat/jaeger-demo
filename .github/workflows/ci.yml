name: Demo CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Demo tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        persist-credentials: false
    - name: Install shell dependencies
      run: sudo apt-get update && sudo apt-get install -y shellcheck jq
    - name: Install shunit2
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        repository: kward/shunit2
        ref: 080159b303537888c5d41910b4d47a5002638e30 # v2.1.8
        path: .tools/shunit2
        persist-credentials: false
    - name: Install Helm for credential-free chart tests
      uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      with:
        version: v4.3.2
        # Fail when the published checksum is missing or does not match.
        checksum-policy: required
    - name: Verify the pinned Helmfile toolchain
      run: make helmfile-tools
    - name: Install and verify constrained OCI CLI without credentials
      env:
        PIP_CONSTRAINT: ${{ github.workspace }}/scripts/demo/oci-cli-constraints.txt
      run: |
        python -m pip install --require-hashes --only-binary :all: --no-binary PyYAML -r scripts/demo/oci-cli-hashes.txt
        # The kubectl configuration action runs this command in the writer workflows
        # with no index, so it passes only when nothing is left to install.
        PIP_NO_INDEX=1 python -m pip install oci-cli
        python scripts/demo/verify_oci_cli.py
    - name: Lint shell scripts
      run: shellcheck scripts/demo/*.sh scripts/utils/*.sh examples/oci/*.sh examples/otel-demo/*.sh ops/oke/*.sh
    - name: Lint workflows
      run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
    - name: Lint Python
      run: |
        python -m pip install -r scripts/utils/lint-requirements.txt
        ruff check .
    - name: Verify the chart archive lock against the publishers
      run: python3 scripts/utils/update-chart-archives.py --check
    - name: Test scripts and chart rendering
      env:
        SHUNIT2: .tools/shunit2
      run: make test

  adoption:
    name: Helmfile render and adoption rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        persist-credentials: false
    - name: Install the constrained YAML dependency
      run: python3 -m pip install -c scripts/demo/oci-cli-constraints.txt PyYAML
    - name: Compare and validate application and companion manifests
      run: python3 scripts/demo/helmfile_tools.py run -- bash scripts/demo/validate-helmfile.sh
    - name: Check the chart object inventory against the pinned charts
      run: python3 scripts/demo/helmfile_tools.py run -- python3 scripts/demo/chart_objects.py --check
    - name: Create the disposable Kubernetes fixture
      working-directory: ${{ runner.temp }}
      run: |
        curl --fail --location --silent --show-error --output kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
        echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind' | sha256sum --check
        chmod u+x kind
        ./kind create cluster --name jaeger-demo-adoption-fixture --kubeconfig "$RUNNER_TEMP/fixture.yaml" \
          --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    - name: Check ownership transfer, no-op apply and retention
      run: |
        python3 scripts/demo/helmfile_tools.py run -- python3 scripts/demo/rehearsals/companion-adoption/exercise.py \
          --kubeconfig "$RUNNER_TEMP/fixture.yaml" --context kind-jaeger-demo-adoption-fixture
    # The release phase rehearsal creates the release namespaces itself and installs its own
    # companion, so it needs a cluster without what the adoption rehearsal left behind.
    - name: Replace the fixture for the release phase rehearsal
      working-directory: ${{ runner.temp }}
      run: |
        ./kind delete cluster --name jaeger-demo-adoption-fixture --kubeconfig "$RUNNER_TEMP/fixture.yaml"
        ./kind create cluster --name jaeger-demo-phases-fixture --kubeconfig "$RUNNER_TEMP/phases-fixture.yaml" \
          --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    - name: Verify failed-release retry, pending states, the OCI gate and direct Helmfile flags
      run: |
        python3 scripts/demo/helmfile_tools.py run -- python3 scripts/demo/rehearsals/release-phases/exercise.py \
          --kubeconfig "$RUNNER_TEMP/phases-fixture.yaml" --context kind-jaeger-demo-phases-fixture
    # The reset rehearsal installs the pinned OpenSearch chart, so it gets a cluster of its own.
    - name: Replace the fixture for the trace reset rehearsal
      working-directory: ${{ runner.temp }}
      run: |
        ./kind delete cluster --name jaeger-demo-phases-fixture --kubeconfig "$RUNNER_TEMP/phases-fixture.yaml"
        ./kind create cluster --name jaeger-demo-reset-fixture --kubeconfig "$RUNNER_TEMP/reset-fixture.yaml" \
          --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    - name: Rehearse the OpenSearch trace reset under the committed manual role
      run: |
        python3 scripts/demo/helmfile_tools.py run -- python3 scripts/demo/rehearsals/opensearch-reset/exercise.py \
          --kubeconfig "$RUNNER_TEMP/reset-fixture.yaml" --context kind-jaeger-demo-reset-fixture

  # The committed deployer role on a real API server: its check against live answers,
  # and the scheduled monitoring upgrade as an identity that holds only the role.
  deployer-access:
    name: Deployer role against a real API server
    runs-on: ubuntu-latest
    # The step limits add up to less than this.
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      timeout-minutes: 1
      with:
        persist-credentials: false
    # The administrator seeds the monitoring release from the base, as production holds it.
    - name: Check out the pull request base
      if: github.event_name == 'pull_request'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      timeout-minutes: 1
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: baseline
        persist-credentials: false
    - name: Install the constrained YAML dependency
      timeout-minutes: 2
      run: python3 -m pip install -c scripts/demo/oci-cli-constraints.txt PyYAML
    # The digest is written here, so the download origin cannot vouch for itself.
    - name: Install the pinned kubectl
      working-directory: ${{ runner.temp }}
      timeout-minutes: 2
      run: |
        mkdir -p bin
        curl --fail --location --silent --show-error --output bin/kubectl https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl
        echo '6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f  bin/kubectl' | sha256sum --check
        chmod u+x bin/kubectl
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
    - name: Install the pinned kind
      working-directory: ${{ runner.temp }}
      timeout-minutes: 2
      run: |
        curl --fail --location --silent --show-error --output kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
        echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind' | sha256sum --check
        chmod u+x kind
    # From the repository root: kind resolves the audit policy's relative path against it.
    - name: Create the disposable Kubernetes fixture with an API audit log
      timeout-minutes: 5
      run: |
        "$RUNNER_TEMP/kind" create cluster --name jaeger-demo-deployer-fixture --kubeconfig "$RUNNER_TEMP/fixture.yaml" \
          --config scripts/demo/rehearsals/deployer-access/kind.yaml \
          --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    - name: Check the role and run the scheduled monitoring upgrade as its holder
      timeout-minutes: 26
      run: |
        base=()
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          base=(--base "$GITHUB_WORKSPACE/baseline")
        fi
        python3 scripts/demo/helmfile_tools.py run -- python3 scripts/demo/rehearsals/deployer-access/exercise.py \
          --kubeconfig "$RUNNER_TEMP/fixture.yaml" --context kind-jaeger-demo-deployer-fixture "${base[@]}"

  # The Helmfile deploy driver of the deploy workflow on a real API server, as a user that holds
  # only the committed deployer role: no-op, failed-release retry, pending refusal, the OCI gate
  # and an incompatible image (#73). Then, on a new cluster, the adoption runbook of
  # docs/cutover.md, whose marked blocks run verbatim as that user (#74).
  operations:
    name: Helmfile deploy driver rehearsal
    runs-on: ubuntu-latest
    # The step limits add up to less than this.
    timeout-minutes: 85
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      timeout-minutes: 1
      with:
        persist-credentials: false
    - name: Install the constrained YAML dependency
      timeout-minutes: 3
      run: python3 -m pip install -c scripts/demo/oci-cli-constraints.txt PyYAML
    - name: Create the disposable Kubernetes fixture
      working-directory: ${{ runner.temp }}
      timeout-minutes: 8
      run: |
        curl --fail --location --silent --show-error --output kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
        echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind' | sha256sum --check
        chmod u+x kind
        ./kind create cluster --name jaeger-demo-operations-fixture --kubeconfig "$RUNNER_TEMP/operations-fixture.yaml" \
          --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    - name: Run the Helmfile deploy driver as the deployer
      timeout-minutes: 30
      run: |
        python3 scripts/demo/helmfile_tools.py run -- python3 scripts/demo/rehearsals/helmfile-deploy/exercise.py \
          --kubeconfig "$RUNNER_TEMP/operations-fixture.yaml" --context kind-jaeger-demo-operations-fixture
    # The runbook rehearsal creates the release namespaces itself, so it needs a cluster without
    # what the driver rehearsal left behind.
    - name: Replace the fixture for the adoption runbook rehearsal
      working-directory: ${{ runner.temp }}
      timeout-minutes: 6
      run: |
        ./kind delete cluster --name jaeger-demo-operations-fixture --kubeconfig "$RUNNER_TEMP/operations-fixture.yaml"
        ./kind create cluster --name jaeger-demo-runbook-fixture --kubeconfig "$RUNNER_TEMP/runbook-fixture.yaml" \
          --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    - name: Rehearse the adoption runbook as the deployer
      timeout-minutes: 35
      run: |
        python3 scripts/demo/helmfile_tools.py run -- python3 scripts/demo/rehearsals/helmfile-runbook/exercise.py \
          --kubeconfig "$RUNNER_TEMP/runbook-fixture.yaml" --context kind-jaeger-demo-runbook-fixture

  render-diff:
    name: Rendered resource changes
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Check out the pull request head
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false
    - name: Check out the pull request base
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: baseline
        persist-credentials: false
    - name: Install the constrained YAML parser
      working-directory: candidate
      run: python3 -m pip install -c scripts/demo/oci-cli-constraints.txt PyYAML
    - name: Compare offline renders
      working-directory: candidate
      run: |
        python3 scripts/demo/helmfile_tools.py run -- python3 scripts/demo/pr_render_diff.py \
          --base "$GITHUB_WORKSPACE/baseline" --head "$PWD" >> "$GITHUB_STEP_SUMMARY"

  renovate:
    name: Renovate discovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        persist-credentials: false
    - name: Verify Renovate configuration and dependency discovery without credentials
      run: make renovate-discovery
