name: Demo smoke check

on:
  schedule:
  - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Public demo health
    # Scheduled runs wait for the opt-in switch: the webhook secret must exist at
    # repository level first, because this job has no environment. Manual
    # dispatch is always available.
    if: github.repository == 'jaegertracing/jaeger-demo' && (github.event_name != 'schedule' || vars.DEMO_SMOKE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        persist-credentials: false
    - name: Check the OCI demo
      run: python3 scripts/demo/stack_health.py --stack oci
    - name: Check the OpenTelemetry demo
      if: ${{ !cancelled() }}
      run: python3 scripts/demo/stack_health.py --stack otel

    # SLACK_WEBHOOK_URL is the only secret used. It must be a repository or
    # organization secret: this job has no environment, so an
    # environment-scoped secret is empty here.
    - name: Send Slack notification on failure
      if: failure() || cancelled()
      uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_CHANNEL: '#jaeger-operations'
        SLACK_COLOR: danger
        SLACK_USERNAME: 'Jaeger CI Bot'
        SLACK_ICON_EMOJI: ':warning:'
        SLACK_TITLE: '🚨 Jaeger Public Demo Smoke Check Failed'
        SLACK_MESSAGE: |
          *Repository:* ${{ github.repository }}
          *Workflow:* ${{ github.workflow }}
          *Run ID:* ${{ github.run_id }}
          *Trigger:* ${{ github.event_name }}
          *Actor:* ${{ github.actor }}

          <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|🔗 View Failed Run>
        SLACK_FOOTER: 'Jaeger CI/CD Pipeline'
