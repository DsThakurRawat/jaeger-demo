name: Reset OTel Demo OpenSearch Trace Data

# Manual only: no schedule, push or workflow_run trigger. A demo-apply reviewer
# approves every run. docs/releases.md describes the operation and its limits.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'list prints what a reset would delete and changes nothing. reset deletes the Jaeger trace indices.'
        required: true
        default: list
        type: choice
        options:
          - list
          - reset
      acknowledgment:
        description: 'For reset, type exactly: delete all Jaeger trace indices in opensearch/opensearch-cluster-single-0'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: jaeger-otel-demo-opensearch-recovery
  cancel-in-progress: false

jobs:
  require-main:
    name: Require protected main branch
    runs-on: ubuntu-latest
    steps:
    - name: Reject non-main dispatches
      env:
        DISPATCH_REF: ${{ github.ref }}
      run: test "$DISPATCH_REF" = 'refs/heads/main'

  reset:
    name: List or reset the Jaeger trace indices
    needs: require-main
    if: github.ref == 'refs/heads/main'
    environment: demo-apply
    runs-on: ubuntu-latest
    # One short request per index, a Jaeger rollout of up to 10m and a trace check
    # of about 2m. The limit keeps a hung run from holding the concurrency group.
    timeout-minutes: 45
    env:
      # The inputs reach the script as data, never as part of a command line.
      RESET_OPERATION: ${{ inputs.operation }}
      RESET_ACKNOWLEDGMENT: ${{ inputs.acknowledgment }}

    steps:
    - name: Checkout demo configuration
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    # A wrong or missing acknowledgment stops the run here, before the job
    # installs the OCI CLI or configures any cluster access.
    - name: Check the request before any cluster access
      run: python3 scripts/demo/opensearch_reset.py "$RESET_OPERATION" --acknowledge "$RESET_ACKNOWLEDGMENT" --validate-only

    # Download and verify the OCI CLI before any step holds the OCI API key. pip
    # rejects a file whose SHA-256 is not in oci-cli-hashes.txt and builds nothing
    # from source except PyYAML, which has no wheel for the runner's Python
    # (docs/deployer-access.md).
    - name: Install the hash-verified OCI CLI
      env:
        PIP_CONSTRAINT: ${{ github.workspace }}/scripts/demo/oci-cli-constraints.txt
      run: |
        python -m pip install --require-hashes --only-binary :all: --no-binary PyYAML -r scripts/demo/oci-cli-hashes.txt

    # The OCI API key is set only on the steps that reach OCI or the cluster. The
    # kubeconfig runs the OCI CLI for a token, so every kubectl call needs it.
    # The action runs pip itself; with no index it cannot download anything here.
    - name: Configure kubectl with OKE
      uses: oracle-actions/configure-kubectl-oke@77a733d79446dabe7bf0e58eb56197d33ce4dc58 # v1.5.0
      env:
        PIP_CONSTRAINT: ${{ github.workspace }}/scripts/demo/oci-cli-constraints.txt
        PIP_NO_INDEX: '1'
        OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
        OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
        OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
        OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      with:
        cluster: ${{ secrets.OKE_CLUSTER_OCID }}
        enablePrivateEndpoint: false

    - name: Verify OCI CLI version
      run: python scripts/demo/verify_oci_cli.py

    # Stop before any change when the credential lacks part of the reviewed role
    # (docs/deployer-access.md).
    - name: Verify the deployment identity's access
      id: access
      timeout-minutes: 10
      env:
        OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
        OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
        OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
        OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      run: python scripts/demo/deployer_access.py check --self --identity manual

    - name: List or reset the Jaeger trace indices
      env:
        OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
        OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
        OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
        OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      run: python3 scripts/demo/opensearch_reset.py "$RESET_OPERATION" --acknowledge "$RESET_ACKNOWLEDGMENT"
