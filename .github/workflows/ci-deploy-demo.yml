name: Deploy Jaeger Demo to OKE

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      expected_config_sha:
        description: 'Reviewed full SHA. Enables the restricted manual single-stack Jaeger handover guards.'
        required: false
      image_tag:
        description: 'Snapshot image tag to deploy for both images. Defaults to jaegertracing/jaeger main.'
        required: false
      jaeger_image_tag:
        description: 'Jaeger snapshot image tag override. Defaults to image_tag or jaegertracing/jaeger main.'
        required: false
      hotrod_image_tag:
        description: 'HotROD snapshot image tag override. Defaults to image_tag or jaegertracing/jaeger main.'
        required: false
      demo_stack:
        description: 'Demo stack to deploy. Defaults to the original OCI demo.'
        required: false
        default: oci
        type: choice
        options:
          - oci
          - otel
          - all
      otel_deploy_scope:
        description: 'Component scope. monitoring applies to OCI; otel-demo and opensearch apply to OTel.'
        required: false
        default: jaeger
        type: choice
        options:
          - jaeger
          - otel-demo
          - opensearch
          - monitoring
          - all
      engine:
        description: 'Deployment engine. helmfile runs scripts/demo/helmfile_deploy.py and requires expected_config_sha.'
        required: false
        default: scripts
        type: choice
        options:
          - scripts
          - helmfile
      helmfile_operation:
        description: 'Helmfile engine only. apply reconciles all ten releases; install-companion installs one absent demo-resources release.'
        required: false
        default: apply
        type: choice
        options:
          - apply
          - install-companion
      companion_namespace:
        description: 'Helmfile install-companion only. The namespace whose demo-resources release to install.'
        required: false
        default: none
        type: choice
        options:
          - none
          - default
          - jaeger
          - opensearch
          - otel-demo

permissions:
  contents: read

jobs:
  # One job serves both triggers. A manual run waits for a demo-apply reviewer.
  # The daily run uses demo-scheduled, which has no reviewer, and only while the
  # DEMO_SCHEDULE_ENABLED repository variable is 'true'. Any other event resolves
  # to the reviewer-gated environment.
  deploy:
    name: Deploy Jaeger to OKE Cluster
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.DEMO_SCHEDULE_ENABLED == 'true'))
    environment: ${{ github.event_name == 'schedule' && 'demo-scheduled' || 'demo-apply' }}
    # Every workflow that changes the cluster shares this group, so one runs at a
    # time. GitHub keeps one waiting run per group: a newer waiting run cancels an
    # older one, and demo-run-observer.yml reports a run cancelled that way.
    concurrency:
      group: jaeger-otel-demo-opensearch-recovery
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # This limit is a cap, not the sum of every wait at its ceiling. The waits are
    # 70m for the OpenSearch and Dashboards Helm releases (10m + 60m), 55m for the
    # other four Helm releases (10m + 15m + 10m + 20m), 15m trace generator
    # restarts, and about 50m of smoke-check and trace-check retries.
    # Rollout checks that directly follow a Helm --wait return at once.
    # The reconcile step is limited to 300m, which leaves 30m for setup and the
    # notification. The three Helmfile preparation steps allow 30m together but
    # take a few minutes; their limits stop a hung download, not a slow run.
    timeout-minutes: 330
    env:
      EXPECTED_CONFIG_SHA: ${{ inputs.expected_config_sha }}
      JAEGER_DEMO_JAEGER_IMAGE_REPOSITORY: jaegertracing/jaeger-snapshot
      JAEGER_DEMO_HOTROD_IMAGE_REPOSITORY: jaegertracing/example-hotrod-snapshot
      JAEGER_DEMO_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
      JAEGER_DEMO_JAEGER_IMAGE_TAG: ${{ github.event.inputs.jaeger_image_tag || github.event.inputs.image_tag }}
      JAEGER_DEMO_HOTROD_IMAGE_TAG: ${{ github.event.inputs.hotrod_image_tag || github.event.inputs.image_tag }}
      JAEGER_DEMO_IMAGE_PULL_POLICY: Always
      # The workflow offers no clean reinstall: its identities cannot create or delete
      # namespaces, so a clean run would leave the demo down (docs/deployer-access.md).
      JAEGER_DEMO_DEPLOY_MODE: upgrade
      JAEGER_DEMO_STACK: ${{ github.event.inputs.demo_stack || 'oci' }}
      JAEGER_OTEL_DEMO_DEPLOY_SCOPE: ${{ github.event.inputs.otel_deploy_scope || 'jaeger' }}
      RUN_PUBLIC_SMOKE_TESTS: "true"
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      # The scripts deploy unless a run selects Helmfile: a scheduled run only through the
      # DEMO_DEPLOY_ENGINE repository variable, a manual run only through its engine input.
      DEPLOY_ENGINE: ${{ github.event_name == 'schedule' && (vars.DEMO_DEPLOY_ENGINE == 'helmfile' && 'helmfile' || 'scripts') || inputs.engine || 'scripts' }}
      HELMFILE_OPERATION: ${{ inputs.helmfile_operation || 'apply' }}
      COMPANION_NAMESPACE: ${{ inputs.companion_namespace || 'none' }}

    steps:
    - name: Verify the reviewed configuration revision
      shell: bash
      run: |
        case "${DEPLOY_ENGINE:-scripts}" in
          scripts|helmfile) ;;
          *) echo "Unknown deployment engine" >&2; exit 1 ;;
        esac
        # A manual Helmfile run deploys only the commit its reviewer approved.
        if [[ "$DEPLOY_ENGINE" == helmfile && "$GITHUB_EVENT_NAME" == workflow_dispatch && -z "$EXPECTED_CONFIG_SHA" ]]; then
          echo "A manual Helmfile run requires expected_config_sha" >&2
          exit 1
        fi
        if [[ -n "$EXPECTED_CONFIG_SHA" ]]; then
          if [[ ! "$EXPECTED_CONFIG_SHA" =~ ^[0-9a-f]{40}$ || "$EXPECTED_CONFIG_SHA" != "$GITHUB_SHA" ]]; then
            echo "The workflow revision does not match the reviewed configuration commit" >&2
            exit 1
          fi
        fi
        # A scheduled run has no reviewer. Re-running an old one must not deploy
        # an old commit, so a re-run has to be at the current main.
        if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
          current=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk '{print $1}')
          if [[ ! "$current" =~ ^[0-9a-f]{40}$ || "$current" != "$GITHUB_SHA" ]]; then
            echo "A re-run of a scheduled deployment must be at the current main commit; wait for the next scheduled run or dispatch manually" >&2
            exit 1
          fi
        fi

    - name: Checkout demo configuration
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Resolve upstream Jaeger main
      shell: bash
      run: |
        core_sha=$(git ls-remote https://github.com/jaegertracing/jaeger.git refs/heads/main | awk '{print $1}')
        if [[ ! "$core_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "Could not resolve jaegertracing/jaeger main to one full commit SHA" >&2
          exit 1
        fi
        printf 'MAIN_SHA=%s\n' "$core_sha" >> "$GITHUB_ENV"
        printf 'Configuration: %s\nUpstream Jaeger main: %s\n' "$GITHUB_SHA" "$core_sha" >> "$GITHUB_STEP_SUMMARY"

    # Download and verify the OCI CLI before any step holds the OCI API key. pip
    # rejects a file whose SHA-256 is not in oci-cli-hashes.txt and builds nothing
    # from source except PyYAML, which has no wheel for the runner's Python
    # (docs/deployer-access.md).
    - name: Install the hash-verified OCI CLI
      env:
        PIP_CONSTRAINT: ${{ github.workspace }}/scripts/demo/oci-cli-constraints.txt
      run: |
        python -m pip install --require-hashes --only-binary :all: --no-binary PyYAML -r scripts/demo/oci-cli-hashes.txt

    # Helmfile engine only. These steps hold no secret and reach no cluster. They run
    # after the hash-verified install, which provides PyYAML, and before any step holds
    # the OCI API key: the pinned tools, the lock-verified charts and, in digest image
    # mode, the image selection and its Jaeger configuration gate.
    - name: Prepare the pinned Helmfile toolchain
      if: env.DEPLOY_ENGINE == 'helmfile'
      timeout-minutes: 5
      run: python3 scripts/demo/helmfile_tools.py check

    - name: Prepare the pinned charts
      if: env.DEPLOY_ENGINE == 'helmfile'
      timeout-minutes: 10
      run: python3 scripts/demo/helmfile_deploy.py prepare

    - name: Resolve and validate images
      if: env.DEPLOY_ENGINE == 'helmfile'
      timeout-minutes: 15
      run: python3 scripts/demo/helmfile_deploy.py images

    # The OCI API key is set only on the steps that reach OCI or the cluster. The
    # kubeconfig runs the OCI CLI for a token, so every kubectl and helm call needs it.
    # The action runs pip itself; with no index it cannot download anything here.
    - name: Configure kubectl with OKE
      id: configure-oke
      uses: oracle-actions/configure-kubectl-oke@77a733d79446dabe7bf0e58eb56197d33ce4dc58 # v1.5.0
      env:
        PIP_CONSTRAINT: ${{ github.workspace }}/scripts/demo/oci-cli-constraints.txt
        PIP_NO_INDEX: '1'
        OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
        OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
        OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
        OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      with:
        cluster: ${{ secrets.OKE_CLUSTER_OCID }}
        enablePrivateEndpoint: false

    - name: Verify OCI CLI version
      run: python scripts/demo/verify_oci_cli.py

    - name: Install Helm
      uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      with:
        version: v4.3.2
        # Fail when the published checksum is missing or does not match.
        checksum-policy: required

    # Stop before any change when the credential lacks part of the reviewed role
    # (docs/deployer-access.md). A partial grant otherwise fails mid-upgrade and
    # leaves a release pending.
    - name: Verify the deployment identity's access
      id: access
      # About nine hundred short requests. The limit keeps a hung API server from
      # holding the concurrency group.
      timeout-minutes: 10
      env:
        DEPLOYER_IDENTITY: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
        OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
        OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
        OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
        OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      run: python scripts/demo/deployer_access.py check --self --identity "$DEPLOYER_IDENTITY"

    # Stop inside the job limit so the notification still runs. This timer starts
    # after setup, so the reserve is the job limit minus this value minus the
    # setup time.
    - name: Reconcile demo components
      id: reconcile
      timeout-minutes: 300
      env:
        OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
        OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
        OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
        OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      run: |
        if [[ "$DEPLOY_ENGINE" == helmfile ]]; then
          python3 scripts/demo/helmfile_deploy.py reconcile
        else
          python3 scripts/demo/deploy.py
        fi

    # The Helmfile engine writes the run's record, also when it fails or refuses.
    # It holds no Secret value, no Helm value and no diff (docs/releases.md#deployment-record).
    - name: Upload the deployment record
      if: always() && hashFiles('deploy-record.json') != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: deploy-record-${{ github.run_id }}-${{ github.run_attempt }}
        path: deploy-record.json
        if-no-files-found: error
        retention-days: 90

    # A cancelled or timed-out job is not a failure() and would otherwise end silently.
    - name: Send detailed Slack notification on failure
      if: failure() || cancelled()
      uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_CHANNEL: '#jaeger-operations'
        SLACK_COLOR: danger
        SLACK_USERNAME: 'Jaeger CI Bot'
        SLACK_ICON_EMOJI: ':warning:'
        SLACK_TITLE: '🚨 Jaeger OKE Deployment Failed'
        SLACK_MESSAGE: |
          *Repository:* ${{ github.repository }}
          *Workflow:* ${{ github.workflow }}
          *Run ID:* ${{ github.run_id }}
          *Status:* ${{ job.status }}
          *Trigger:* ${{ github.event_name }}
          *Actor:* ${{ github.actor }}

          <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|🔗 View Failed Run>
        SLACK_FOOTER: 'Jaeger CI/CD Pipeline'
