name: Publish the demo executor image
on:
  workflow_dispatch:
    inputs:
      configuration_sha:
        description: Full reviewed main commit to publish
        required: true
        type: string
permissions: {}
jobs:
  candidate:
    if: github.repository == 'jaegertracing/jaeger-demo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.rehearsal.outputs.digest }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
    - name: Verify the release commit
      env:
        EXPECTED_SHA: ${{ inputs.configuration_sha }}
      run: test "$EXPECTED_SHA" = "$GITHUB_SHA"
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        persist-credentials: false
    - id: rehearsal
      uses: ./.github/actions/rehearse-executor
    - id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: executor-oci-${{ github.run_attempt }}
        path: ${{ runner.temp }}/executor.tar
        if-no-files-found: error
        compression-level: 0
        retention-days: 1

  publish:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    env:
      EXPECTED_DIGEST: ${{ needs.candidate.outputs.digest }}
      PACKAGE: ghcr.io/jaegertracing/jaeger-demo-executor
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.candidate.outputs.artifact_id }}
        path: ${{ runner.temp }}
        digest-mismatch: error
    - name: Verify the transferred OCI manifest before publication
      run: |
        set -euo pipefail
        [[ $EXPECTED_DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
        skopeo inspect --raw "oci-archive:$RUNNER_TEMP/executor.tar" > "$RUNNER_TEMP/candidate-manifest"
        test "$(skopeo manifest-digest "$RUNNER_TEMP/candidate-manifest")" = "$EXPECTED_DIGEST"
    - name: Publish the rehearsed digest and verify the registry tag
      env:
        PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        umask 077
        auth_dir=$(mktemp -d "$RUNNER_TEMP/registry.XXXXXX")
        trap 'rm -rf "$auth_dir"' EXIT
        printf '%s' "$PACKAGE_TOKEN" | skopeo login --authfile "$auth_dir/auth.json" \
          --username "$GITHUB_ACTOR" --password-stdin ghcr.io
        unset PACKAGE_TOKEN
        dest="docker://$PACKAGE:$GITHUB_SHA"
        skopeo copy --preserve-digests --dest-authfile "$auth_dir/auth.json" --digestfile "$auth_dir/copied" \
          "oci-archive:$RUNNER_TEMP/executor.tar" "$dest"
        test "$(cat "$auth_dir/copied")" = "$EXPECTED_DIGEST"
        skopeo inspect --authfile "$auth_dir/auth.json" --raw "$dest" > "$auth_dir/published"
        test "$(skopeo manifest-digest "$auth_dir/published")" = "$EXPECTED_DIGEST"
        printf 'Reviewed commit %s\n\nInstallation image %s@%s\n' "$GITHUB_SHA" "$PACKAGE" "$EXPECTED_DIGEST" >> "$GITHUB_STEP_SUMMARY"
