# Configuration for Prometheus , Grafana , Alertmanager can be set from this configuration

# Keep hook tags and digests together so Helm renders the reviewed image on upgrade and rollback.
crds:
  upgradeJob:
    image:
      busybox:
        # renovate: datasource=docker depName=docker.io/library/busybox
        tag: "1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4"
      kubectl:
        # renovate: datasource=docker depName=registry.k8s.io/kubectl
        tag: "v1.37.0@sha256:5ed410ebac5dc976cc717098994dcdb29bbbd38f6bd65f582311f5be4ba719cf"

prometheusOperator:
  admissionWebhooks:
    patch:
      # Keep the existing Opaque certificate Secret. The chart default,
      # kubernetes.io/tls, makes the certificate job delete and recreate that
      # Secret and gives its Role a delete rule. Keeping it leaves the hook's
      # Role unchanged.
      secretType: ""
      image:
        # renovate: datasource=docker depName=ghcr.io/jkroepke/kube-webhook-certgen
        tag: "1.11.1@sha256:8009b04f9873f7279b5adee37fdd03b6a9aa7b6751d4f69fde2683010e41cd1f"

fullnameOverride: ""
prometheus:
  # The control-plane ServiceMonitors read the Prometheus pod's projected
  # token through this scrape class, as they did through bearerTokenFile
  # before. The chart's alternative is a service-account-token Secret, whose
  # data Kubernetes fills in after creation, a long-lived token the projected
  # one makes unnecessary, so that Secret is not created.
  controlPlaneScrapeClass:
    enabled: true
  serviceAccount:
    createTokenSecret: false
  prometheusSpec:
    enableAdminAPI: true
    additionalScrapeConfigs: |
      - job_name: aggregated-trace-metrics
        static_configs:
          - targets: ['jaeger-collector-prometheus.default.svc.cluster.local:8889']
        scrape_interval:     15s


grafana:
  # The demo does not run Helm tests, so keep the release at its twelve hooks.
  testFramework:
    enabled: false
  # Allow index creation and plugin installation to finish before liveness checks.
  livenessProbe:
    initialDelaySeconds: 600
  grafana.ini:
    server:
      domain: demo.jaegertracing.io
      root_url: "%(protocol)s://%(domain)s/grafana/"
      serve_from_sub_path: true
